      function words(el, text) {
        el.textContent = "";

        let inAcc = false;
        text.split("|").forEach((line, li) => {

            const m = w.match(/^(.*?)\*([^\s*]*)$/);
            const core = m ? m[1] : w, tail = m ? m[2] : "";
            if (inAcc) {
              const a = document.createElement("span");
              a.className = "acc";
              a.textContent = core;
              s.appendChild(a);
            } else {
              s.textContent = core;
            }
            if (tail) s.appendChild(document.createTextNode(tail));
            if (m) inAcc = false;
            el.appendChild(s);
            out.push(s);
          });
        });
        return out;
      }

      blurOut(7.2, [$("#s7-contact"), $("#s7-capw"), $("#s7-inname"), $("#s7-capi")], 0.2, 0.04);
