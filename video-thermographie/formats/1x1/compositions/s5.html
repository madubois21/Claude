  <script>
    (function () {
      const R = document.querySelector('[data-composition-id="s5"]') || document;
      const $ = (s) => R.querySelector(s);
      const $$ = (s) => Array.from(R.querySelectorAll(s));
      let V = {};
      try {
        V = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      } catch (e) {}
      const txt = (id, d) => (typeof V[id] === "string" && V[id].trim().length ? V[id] : d);
      // "a b|c *d*." -> word spans; "|" = line break, *x* = accent colour
      function words(el, text) {
        el.textContent = "";
        const out = [];
        let inAcc = false;
        text.split("|").forEach((line, li) => {
          if (li) el.appendChild(document.createElement("br"));
          line.trim().split(/\s+/).forEach((w, i) => {
            if (i) el.appendChild(document.createTextNode(" "));
            const s = document.createElement("span");
            s.className = "w";
            if (w.startsWith("*")) { inAcc = true; w = w.slice(1); }
            const m = w.match(/^(.*?)\*([^\s*]*)$/);
            const core = m ? m[1] : w, tail = m ? m[2] : "";
            if (inAcc) {
              const a = document.createElement("span");
              a.className = "acc";
              a.textContent = core;
              s.appendChild(a);
            } else {
              s.textContent = core;
            }
            if (tail) s.appendChild(document.createTextNode(tail));
            if (m) inAcc = false;
            el.appendChild(s);
            out.push(s);
          });
        });
        return out;
      }
      const tl = gsap.timeline({ paused: true });
      const draw = (t, els, d = 0.8, ease = "power2.inOut", stagger = 0) =>
        tl.fromTo(els, { attr: { "stroke-dashoffset": 1.05 } }, { attr: { "stroke-dashoffset": 0 }, duration: d, ease, stagger }, t);
      const undraw = (t, els, d = 0.5, ease = "power3.in", stagger = 0) =>
        tl.to(els, { attr: { "stroke-dashoffset": -1.15 }, duration: d, ease, stagger }, t);
      const solid = (t, els) => tl.set(els, { strokeDasharray: "none" }, t);
      const blurIn = (t, els, d = 0.15, stagger = 0.067, px = 6) =>
        tl.fromTo(els, { opacity: 0, filter: "blur(" + px + "px)" }, { opacity: 1, filter: "blur(0px)", duration: d, ease: "power2.out", stagger }, t);
      const blurOut = (t, els, d = 0.18, stagger = 0.03, px = 8) =>
        tl.to(els, { opacity: 0, filter: "blur(" + px + "px)", duration: d, ease: "power2.in", stagger }, t);
      const fadeIn = (t, els, d = 0.4, stagger = 0, ease = "power1.out") =>
        tl.fromTo(els, { opacity: 0 }, { opacity: 1, duration: d, ease, stagger }, t);
      const fadeOut = (t, els, d = 0.3, stagger = 0, ease = "power1.in") =>
        tl.to(els, { opacity: 0, duration: d, ease, stagger }, t);

      const title = words($("#s5-title"), txt("s5-title", "Un rapport *aux normes*,|pour agir vite."));
      ["s5-i0", "s5-i1", "s5-i2", "s5-i3"].forEach((id) => { const v = txt(id, ""); if (v) $("#" + id).textContent = v; });
      // 1. la feuille se dessine autour de la vignette
      draw(0, $("#s5-doc"), 1.1, "power2.inOut");
      fadeIn(0.2, $("#s5-paper"), 0.7);
      blurIn(0.55, $("#s5-h"), 0.2);
      draw(0.65, $("#s5-rule"), 0.45, "power2.out");
      // 2. titre
      blurIn(0.9, title, 0.15, 0.067);
      // 3. checklist cochée
      draw(1.1, $$(".s5-box"), 0.35, "power2.out", 0.1);
      blurIn(1.2, [$("#s5-i0"), $("#s5-i1"), $("#s5-i2"), $("#s5-i3")], 0.18, 0.15);
      [1.7, 1.95, 2.2, 2.45].forEach((t, i) => draw(t, $("#s5-k" + i), 0.22, "power2.out"));
      draw(1.6, $$(".s5-foot"), 0.4, "power2.out", 0.1);
      // 4. le tampon « conforme IEC TS 62446-3 » s'appose
      tl.fromTo($("#s5-stamp"), { opacity: 0, scale: 1.45, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.8)" }, 2.7);
      // 5. graphique production : installation saine vs avec défauts
      draw(2.3, [$("#s5-ay"), $("#s5-ax")], 0.55, "power3.out", 0.08);
      draw(2.7, [$("#s5-aya"), $("#s5-axa")], 0.22, "power2.out", 0.05);
      fadeIn(2.55, [$("#s5-grid"), $("#s5-yt")], 0.4, 0.08);
      blurIn(2.6, $("#s5-lab-y"), 0.18);
      [0, 1].forEach((i) => {
        const b = $("#s5-bar" + i);
        const top = parseFloat(b.getAttribute("data-top")), h = parseFloat(b.getAttribute("data-h"));
        tl.fromTo(b, { attr: { y: 850, height: 0 } }, { attr: { y: top, height: h }, duration: 0.75, ease: "power3.out" }, 2.95 + i * 0.3);
        blurIn(3.2 + i * 0.3, $("#s5-cat" + i), 0.18);
      });
      // 6. sortie : le graphique se floute, le rapport file dans la plateforme
      blurOut(5.15, [...title, $("#s5-lab-y"), $("#s5-cat0"), $("#s5-cat1")], 0.2, 0.015);
      blurOut(5.2, [$("#s5-chart")], 0.22, 0);
      fadeOut(5.42, [$("#s5-h"), $("#s5-i0"), $("#s5-i1"), $("#s5-i2"), $("#s5-i3"), $("#s5-stamp")], 0.1);
      tl.to($("#s5-docw"), { x: 525.83, y: -217.86, scale: 0.04468, transformOrigin: "520px 520px", duration: 0.48, ease: "power2.inOut" }, 5.45);
      window.__timelines["s5"] = tl;
    })();
