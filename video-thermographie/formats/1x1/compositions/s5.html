    <div id="s5-i0" class="item" style="left: 1068px; top: 419px">Anomalies localisées</div><div id="s5-i1" class="item" style="left: 1068px; top: 499px">Priorités d’intervention</div><div id="s5-i2" class="item" style="left: 1068px; top: 579px">Recommandations</div><div id="s5-i3" class="item" style="left: 1068px; top: 659px">Justificatif assurance</div>
    </div>
    <div id="s5-t1" class="title" style="left: 108px; top: 150px; font-size: 52px">Chaque défaut est<br />localisé et qualifié.</div>
    <div id="s5-t2" class="title" style="left: 108px; top: 150px; font-size: 52px">Classés par gravité,<br />avec l’action à mener.</div>
    <div id="s5-t3" class="title" style="left: 108px; top: 150px; font-size: 52px">Un rapport aux normes,<br />pour agir rapidement.</div>
  </div>
  <script>
    (function () {
      const R = document.querySelector('[data-composition-id="s5"]') || document;
      const $ = (s) => R.querySelector(s);
      const $$ = (s) => Array.from(R.querySelectorAll(s));
      let V = {};
      try {
        V = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      } catch (e) {}
      const txt = (id, d) => (typeof V[id] === "string" && V[id].trim().length ? V[id] : d);
      // "a b|c *d*." -> word spans; "|" = line break, *x* = accent colour
      function words(el, text) {
        el.textContent = "";
        const out = [];
        let inAcc = false;
        text.split("|").forEach((line, li) => {
          if (li) el.appendChild(document.createElement("br"));
          line.trim().split(/\s+/).forEach((w, i) => {
            if (i) el.appendChild(document.createTextNode(" "));
            const s = document.createElement("span");
            s.className = "w";
            if (w.startsWith("*")) { inAcc = true; w = w.slice(1); }
            const m = w.match(/^(.*?)\*([^\s*]*)$/);
            const core = m ? m[1] : w, tail = m ? m[2] : "";
            if (inAcc) {
              const a = document.createElement("span");
              a.className = "acc";
              a.textContent = core;
              s.appendChild(a);
            } else {
              s.textContent = core;
            }
            if (tail) s.appendChild(document.createTextNode(tail));
            if (m) inAcc = false;
            el.appendChild(s);
            out.push(s);
          });
        });
        return out;
      }
      const tl = gsap.timeline({ paused: true });
      // SVG de zoom (non-scaling-stroke) : les tirets sont posés à l'échelle de l'écran, le motif suit donc
      // l'échelle de l'SVG au moment du tracé (data-dash), sinon la fin du trait n'apparaît qu'au passage en plein.
      const dk = (el) => { const z = el.closest ? el.closest("svg[data-dash]") : null; return z ? parseFloat(z.getAttribute("data-dash")) : 1; };
      $$("svg[data-dash] .d").forEach((el) => {
        const k = dk(el);
        el.style.strokeDasharray = k + " " + 1.2 * k;
        el.setAttribute("stroke-dashoffset", 1.05 * k);
      });
      const draw = (t, els, d = 0.8, ease = "power2.inOut", stagger = 0) =>
        tl.fromTo(els, { attr: { "stroke-dashoffset": (i, el) => 1.05 * dk(el) } }, { attr: { "stroke-dashoffset": 0 }, duration: d, ease, stagger }, t);
      const undraw = (t, els, d = 0.5, ease = "power3.in", stagger = 0) =>
        tl.to(els, { attr: { "stroke-dashoffset": (i, el) => -1.15 * dk(el) }, duration: d, ease, stagger }, t);
      const solid = (t, els) => tl.set(els, { strokeDasharray: "none" }, t);
      const blurIn = (t, els, d = 0.15, stagger = 0.067, px = 6) =>
        tl.fromTo(els, { opacity: 0, filter: "blur(" + px + "px)" }, { opacity: 1, filter: "blur(0px)", duration: d, ease: "power2.out", stagger }, t);
      const blurOut = (t, els, d = 0.18, stagger = 0.03, px = 8) =>
        tl.to(els, { opacity: 0, filter: "blur(" + px + "px)", duration: d, ease: "power2.in", stagger }, t);
      const fadeIn = (t, els, d = 0.4, stagger = 0, ease = "power1.out") =>
        tl.fromTo(els, { opacity: 0 }, { opacity: 1, duration: d, ease, stagger }, t);
      const fadeOut = (t, els, d = 0.3, stagger = 0, ease = "power1.in") =>
        tl.to(els, { opacity: 0, duration: d, ease, stagger }, t);

      const t1 = words($("#s5-t1"), txt("s5-t1", "Chaque défaut est|localisé et *qualifié*."));
      const t2 = words($("#s5-t2"), txt("s5-t2", "Classés par *gravité*,|avec l’action à mener."));
      const t3 = words($("#s5-t3"), txt("s5-t3", "Un rapport *aux normes*,|pour agir rapidement."));
      ["s5-i0", "s5-i1", "s5-i2", "s5-i3"].forEach((id) => { const v = txt(id, ""); if (v) $("#" + id).textContent = v; });
      const P1 = $("#s5-p1"), P2 = $("#s5-p2"), P3 = $("#s5-p3");
      const pageOut = (t, el) => tl.to(el, { opacity: 0, x: -30, filter: "blur(6px)", duration: 0.22, ease: "power2.in" }, t);
      const pageIn = (t, el) => tl.fromTo(el, { opacity: 0, x: 30, filter: "blur(6px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.32, ease: "power3.out" }, t);
      // 1. la feuille se dessine autour de la vignette ; les autres pages du rapport se devinent derrière
      draw(0, $("#s5-doc"), 1.1, "power2.inOut");
      fadeIn(0.2, $("#s5-paper"), 0.7);
      fadeIn(0.6, $$(".s5-sheet"), 0.5, 0.12);
      // PAGE 1 — analyse détaillée du défaut
      blurIn(0.55, P1.querySelector(".dochead"), 0.2);
      draw(0.65, P1.querySelector(".s5-rule"), 0.45, "power2.out");
      blurIn(0.9, t1, 0.15, 0.067);
      blurIn(2.8, $$("#s5-p1 .s5-f"), 0.18, 0.2); // voix : « chaque défaut y est décrit… »
      tl.fromTo($("#s5-badge"), { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, 4.45); // « …et qualifié »
      fadeIn(1.7, $$("#s5-p1 .s5-foot"), 0.3, 0.1);
      // PAGE 2 — résultats et gravité
      blurOut(5.15, t1, 0.16, 0.02);
      pageOut(5.15, P1);
      pageIn(5.35, P2);
      draw(5.4, P2.querySelector(".s5-rule"), 0.4, "power2.out");
      blurIn(5.45, t2, 0.15, 0.067);
      draw(5.55, $$(".s5-card"), 0.4, "power2.out", 0.1);
      [["#s5-n0", 7], ["#s5-n1", 5]].forEach(([id, v], i) => {
        const el = $(id), o = { v: 0 };
        tl.fromTo(o, { v: 0 }, { v, duration: 0.6, ease: "power2.out", onUpdate: () => { el.textContent = Math.round(o.v); } }, 5.7 + i * 0.12);
      });
      blurIn(5.65, [$("#s5-n0"), $("#s5-n1"), $("#s5-n2"), ...$$(".s5-cardl")], 0.2, 0.06);
      blurIn(6.15, $("#s5-sub"), 0.18);
      fadeIn(6.25, $$(".s5-sw"), 0.25, 0.1);
      blurIn(6.3, $$(".s5-cl"), 0.18, 0.1);
      $$(".s5-gbar").forEach((b, i) => {
        tl.fromTo(b, { attr: { width: 0 } }, { attr: { width: parseFloat(b.getAttribute("data-w")) }, duration: 0.5, ease: "power3.out" }, 6.45 + i * 0.1);
      });
      fadeIn(6.75, $$("#s5-p2 .s5-foot"), 0.3, 0.1);
      //   graphique de production (fourni par le client)
      draw(5.85, [$("#s5-ay"), $("#s5-ax")], 0.55, "power3.out", 0.08);
      draw(6.25, [$("#s5-aya"), $("#s5-axa")], 0.22, "power2.out", 0.05);
      fadeIn(6.1, [$("#s5-grid"), $("#s5-yt")], 0.4, 0.08);
      blurIn(6.15, $("#s5-lab-y"), 0.18);
      [0, 1].forEach((i) => {
        const b = $("#s5-bar" + i);
        const top = parseFloat(b.getAttribute("data-top")), h = parseFloat(b.getAttribute("data-h"));
        tl.fromTo(b, { attr: { y: 850, height: 0 } }, { attr: { y: top, height: h }, duration: 0.75, ease: "power3.out" }, 6.5 + i * 0.3);
        blurIn(6.75 + i * 0.3, $("#s5-cat" + i), 0.18);
      });
      // PAGE 3 — couverture du rapport, conforme à la norme
      blurOut(8.7, t2, 0.16, 0.02);
      blurOut(8.7, [$("#s5-chart"), $("#s5-lab-y"), $("#s5-cat0"), $("#s5-cat1")], 0.2, 0.02);
      pageOut(8.7, P2);
      pageIn(8.9, P3);
      blurIn(9.0, t3, 0.15, 0.067);
      draw(9.0, $("#s5-acc"), 0.4, "power2.out");
      blurIn(9.05, $("#s5-ct"), 0.2);
      blurIn(9.25, $("#s5-cs"), 0.2);
      draw(9.1, $$(".s5-ill"), 0.4, "power2.out", 0.05);
      fadeIn(9.5, $("#s5-hotc"), 0.3);
      fadeIn(9.6, $("#s5-mlogo"), 0.35);
      tl.fromTo($("#s5-stamp"), { opacity: 0, scale: 1.45, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.8)" }, 9.9);
      //   ce que contient le rapport
      draw(10.1, $$(".s5-box"), 0.3, "power2.out", 0.1);
      blurIn(10.2, [$("#s5-i0"), $("#s5-i1"), $("#s5-i2"), $("#s5-i3")], 0.18, 0.15);
      [10.5, 10.75, 11.0, 11.25].forEach((t, i) => draw(t, $("#s5-k" + i), 0.22, "power2.out"));
      // 4. sortie : le rapport file dans la plateforme
      blurOut(11.75, [...t3, $("#s5-i0"), $("#s5-i1"), $("#s5-i2"), $("#s5-i3")], 0.2, 0.015);
      blurOut(11.8, [$("#s5-check")], 0.2, 0);
      fadeOut(11.83, [$("#s5-ct"), $("#s5-cs"), $("#s5-stamp"), $("#s5-mlogo")], 0.1);
      tl.to($("#s5-docw"), { x: 525.83, y: -217.86, scale: 0.04468, transformOrigin: "520px 520px", duration: 0.48, ease: "power2.inOut" }, 11.85);
      window.__timelines["s5"] = tl;
    })();
  </script>
</template>
